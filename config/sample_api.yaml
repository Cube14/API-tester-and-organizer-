
openapi: 3.0.0

info:
  title: API Sentinel Test API
  version: 1.0.0
  description: Local API security testing specification

servers:
  - url: http://127.0.0.1:8000

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

paths:

  /api/users/{user_id}:
    get:
      summary: Retrieve user details
      operationId: getUser
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details

  /api/users/{user_id}/orders:
    get:
      summary: Retrieve user orders
      operationId: getUserOrders
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User orders

  /api/profile:
    get:
      summary: Retrieve current user profile
      operationId: getProfile
      responses:
        "200":
          description: Current profile

  /api/health:
    get:
      summary: Public health endpoint
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: API health status
